[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ticuida"
version = "0.1.0"
description = "TiCuida – pré-triagem online e lotação de unidades de saúde (API Flask + SPA Vue 3)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bernardo Abaurre" }]
dependencies = [
    "Flask>=3.0",
    "Flask-SQLAlchemy>=3.1",
    "Flask-Migrate>=4.0",
    "Flask-JWT-Extended>=4.6",
    "Flask-Cors>=4.0",
    "pydantic>=2.6",
    "email-validator>=2.1",
    "python-dotenv>=1.0",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "flake8>=7.0",
    "invoke>=2.2",
]
test = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ticuida*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.black]
line-length = 100
extend-exclude = "migrations|frontend"
